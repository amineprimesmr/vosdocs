# Vérifications à chaque push / PR. Le déploiement Vercel est déclenché par le push sur main
# quand le projet est lié au dépôt GitHub (Vercel → Settings → Git).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Prisma exige DATABASE_URL même pour validate / generate (aucune connexion réelle au build).
    env:
      DATABASE_URL: postgresql://github_actions_placeholder:unused@127.0.0.1:5432/ci_schema_only?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Prisma generate
        run: npm run build
